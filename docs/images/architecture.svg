<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <rect width="1180" height="760" fill="#ffffff"/>
  <text x="590" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#202020">APIM AI Gateway — Learning Lab Architecture</text>

  <!-- Client -->
  <rect x="40" y="110" width="170" height="80" rx="10" fill="#eef4ff" stroke="#3b6fd6" stroke-width="2"/>
  <text x="125" y="145" text-anchor="middle" font-size="15" font-weight="600" fill="#1f3c7a">Client app</text>
  <text x="125" y="165" text-anchor="middle" font-size="12" fill="#3b5a9a">(api-key header)</text>

  <!-- Arrow to APIM -->
  <line x1="210" y1="150" x2="265" y2="150" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- APIM box -->
  <rect x="270" y="70" width="430" height="300" rx="12" fill="#fff8e6" stroke="#d6a93b" stroke-width="2.5"/>
  <text x="485" y="98" text-anchor="middle" font-size="17" font-weight="700" fill="#6b4e00">Azure API Management (APIM)</text>
  <text x="485" y="116" text-anchor="middle" font-size="12" fill="#8a6a10">one hostname, Developer SKU</text>

  <!-- Policy pipeline steps -->
  <rect x="295" y="130" width="380" height="42" rx="6" fill="#ffe9b3" stroke="#c99a2e"/>
  <text x="305" y="155" font-size="13" fill="#5c4300">① llm-token-limit  →  per-consumer token budget (COST CONTROL)</text>

  <rect x="295" y="178" width="380" height="42" rx="6" fill="#ffe9b3" stroke="#c99a2e"/>
  <text x="305" y="203" font-size="13" fill="#5c4300">② llm-emit-token-metric  →  chargeback telemetry</text>

  <rect x="295" y="226" width="380" height="42" rx="6" fill="#ffe9b3" stroke="#c99a2e"/>
  <text x="305" y="251" font-size="13" fill="#5c4300">③ choose → set-backend-service  →  route by model (ROUTING)</text>

  <rect x="295" y="274" width="380" height="42" rx="6" fill="#ffe9b3" stroke="#c99a2e"/>
  <text x="305" y="299" font-size="13" fill="#5c4300">④ authentication-managed-identity  →  keyless auth</text>

  <rect x="295" y="322" width="380" height="36" rx="6" fill="#f3e3ff" stroke="#9b5fd6"/>
  <text x="305" y="345" font-size="13" fill="#4a1f70">retry + circuit breaker (RESILIENCE, on backend pool)</text>

  <!-- Arrow from APIM down to pool -->
  <line x1="485" y1="370" x2="485" y2="420" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Pool box -->
  <rect x="320" y="424" width="330" height="60" rx="10" fill="#e9f7ef" stroke="#2fa86a" stroke-width="2"/>
  <text x="485" y="450" text-anchor="middle" font-size="14" font-weight="700" fill="#1a6b43">backend pool: pool-primary</text>
  <text x="485" y="470" text-anchor="middle" font-size="12" fill="#2d8a5a">round-robin, equal priority, both regions</text>

  <!-- split to two regions -->
  <line x1="485" y1="484" x2="485" y2="505" stroke="#333" stroke-width="2"/>
  <line x1="340" y1="505" x2="630" y2="505" stroke="#333" stroke-width="2"/>
  <line x1="340" y1="505" x2="340" y2="525" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630" y1="505" x2="630" y2="525" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Region A -->
  <rect x="220" y="530" width="240" height="90" rx="10" fill="#eaf1ff" stroke="#3b6fd6" stroke-width="2"/>
  <text x="340" y="556" text-anchor="middle" font-size="14" font-weight="700" fill="#1f3c7a">Azure OpenAI — Region A</text>
  <text x="340" y="576" text-anchor="middle" font-size="12" fill="#3b5a9a">e.g. East US 2</text>
  <text x="340" y="596" text-anchor="middle" font-size="12" font-weight="600" fill="#1f3c7a">deployment: gpt-4o-mini-lab</text>

  <!-- Region B -->
  <rect x="510" y="530" width="240" height="90" rx="10" fill="#eaf1ff" stroke="#3b6fd6" stroke-width="2"/>
  <text x="630" y="556" text-anchor="middle" font-size="14" font-weight="700" fill="#1f3c7a">Azure OpenAI — Region B</text>
  <text x="630" y="576" text-anchor="middle" font-size="12" fill="#3b5a9a">e.g. West US 3</text>
  <text x="630" y="596" text-anchor="middle" font-size="12" font-weight="600" fill="#1f3c7a">deployment: gpt-4o-mini-lab</text>

  <text x="340" y="636" text-anchor="middle" font-size="11" font-style="italic" fill="#b8860b">⚠ names must match exactly</text>
  <text x="630" y="636" text-anchor="middle" font-size="11" font-style="italic" fill="#b8860b">⚠ names must match exactly</text>

  <!-- Pinned backend off to the side for routing pillar -->
  <line x1="675" y1="247" x2="820" y2="247" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="820" y="210" width="230" height="75" rx="10" fill="#f3e3ff" stroke="#9b5fd6" stroke-width="2"/>
  <text x="935" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#4a1f70">Pinned backend</text>
  <text x="935" y="254" text-anchor="middle" font-size="11" fill="#5c3080">single region, specialty model</text>
  <text x="935" y="272" text-anchor="middle" font-size="11" fill="#5c3080">(demonstrates routing choice)</text>

  <!-- Legend -->
  <rect x="820" y="420" width="320" height="195" rx="10" fill="#fafafa" stroke="#ccc"/>
  <text x="835" y="443" font-size="13" font-weight="700" fill="#333">Legend</text>
  <rect x="835" y="453" width="16" height="16" fill="#ffe9b3" stroke="#c99a2e"/>
  <text x="858" y="465" font-size="12" fill="#333">Cost control / routing / auth policy</text>
  <rect x="835" y="476" width="16" height="16" fill="#f3e3ff" stroke="#9b5fd6"/>
  <text x="858" y="488" font-size="12" fill="#333">Resilience (retry / circuit breaker)</text>
  <rect x="835" y="499" width="16" height="16" fill="#e9f7ef" stroke="#2fa86a"/>
  <text x="858" y="511" font-size="12" fill="#333">Load-balanced pool</text>
  <rect x="835" y="522" width="16" height="16" fill="#eaf1ff" stroke="#3b6fd6"/>
  <text x="858" y="534" font-size="12" fill="#333">Azure OpenAI backend</text>
  <text x="835" y="558" font-size="11" fill="#666">Client only ever sees one hostname —</text>
  <text x="835" y="574" font-size="11" fill="#666">region, model, and auth are all handled</text>
  <text x="835" y="590" font-size="11" fill="#666">behind the gateway.</text>
</svg>
